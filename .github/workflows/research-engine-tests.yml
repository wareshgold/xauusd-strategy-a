name: Research engine tests

on:
  push:
    paths:
      - 'research/engine/**'
      - 'requirements-research.txt'
      - '.github/workflows/research-engine-tests.yml'
  pull_request:
    paths:
      - 'research/engine/**'
      - 'requirements-research.txt'
      - '.github/workflows/research-engine-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pytest -q research/engine
