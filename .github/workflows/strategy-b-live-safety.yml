name: Strategy B PythonTraderBot Safety Tests

on:
  push:
    branches:
      - "research/strategy-b-pythontraderbot-execution-20261022"
  pull_request:

jobs:
  strategy-b-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run offline Strategy B tests only
        run: |
          python -m pytest -q \
            tests/test_strategy_b_live_bot_safety.py \
            tests/test_strategy_b_pythontraderbot_core.py \
            tests/test_strategy_b_forward_observer_safety.py
