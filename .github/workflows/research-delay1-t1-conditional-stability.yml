name: Research - DELAY1 T1 MAE conditional stability

on:
  workflow_dispatch:
  push:
    branches:
      - research/entry-edge-post-entry-path
    paths:
      - scripts/analyze-delay1-t1-state-conditional-stability.mjs
      - package.json
      - pnpm-lock.yaml
      - src/**
      - data/historical/**
      - data/reports/strategy-a-baseline/**
      - .github/workflows/research-delay1-t1-conditional-stability.yml

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/entry-edge-post-entry-path
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/analyze-delay1-t1-state-conditional-stability.mjs
      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: delay1-t1-conditional-stability
          path: data/reports/strategy-a-t1-conditional-stability/*.json
