name: research-sp2l-fixture-suite

on:
  push:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.*'
      - '.github/workflows/research-sp2l-fixture-suite.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.*'
      - '.github/workflows/research-sp2l-fixture-suite.yml'

permissions:
  contents: read

jobs:
  fixture-suite:
    name: SP2L synthetic fixture suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Run deterministic tests
        run: npm test
