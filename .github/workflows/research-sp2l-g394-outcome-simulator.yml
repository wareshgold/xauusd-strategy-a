name: Research - SP2L G394 Outcome Simulator

on:
  push:
    branches:
      - research/sp2l-g388-dataset-runner-2026-09-13
    paths:
      - 'src/domain/research/sp2l-v2/G394OutcomeSimulator.ts'
      - 'tests/sp2l-v2/g394-outcome-simulator.test.ts'
      - 'docs/research/G394_OUTCOME_SIMULATOR_2026-09-13.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/research-sp2l-g394-outcome-simulator.yml'
  pull_request:
    paths:
      - 'src/domain/research/sp2l-v2/G394OutcomeSimulator.ts'
      - 'tests/sp2l-v2/g394-outcome-simulator.test.ts'
      - 'docs/research/G394_OUTCOME_SIMULATOR_2026-09-13.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/research-sp2l-g394-outcome-simulator.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run tests/sp2l-v2/g394-outcome-simulator.test.ts
