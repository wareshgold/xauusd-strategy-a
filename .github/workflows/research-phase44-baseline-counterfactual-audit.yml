name: Research - SP2L Phase44 Baseline Counterfactual Audit
on:
  push:
    branches: [research/phase42-full-history-expansion]
    paths:
      - 'scripts/research-phase44-baseline-counterfactual-audit.mjs'
      - 'src/**'
      - 'data/acquired/g50/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/research-phase44-baseline-counterfactual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run research:phase44-baseline-counterfactual-audit
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-a-phase44-baseline-counterfactual-audit
          path: data/reports/strategy-a-phase44-baseline-counterfactual-audit/5min.json
