name: Research - SP2L Manual Adjudication Gate

on:
  push:
  pull_request:

jobs:
  adjudication-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run adjudication contract tests
        run: python -m pytest -q research/evidence/test_sp2l_manual_adjudication.py
      - name: Re-run adjudication contract tests
        run: python -m pytest -q research/evidence/test_sp2l_manual_adjudication.py
      - name: Governance scan of executable adjudication component
        run: |
          ! grep -niE 'BUY|SELL|P-Gap|P-GAP|AB=CD|Leg.?2|target.?formula|refresh.?threshold|entry.?anchor|fill.?semantics|buffer' research/evidence/sp2l_manual_adjudication.py
