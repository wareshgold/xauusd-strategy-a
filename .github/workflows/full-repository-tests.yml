name: Full Repository Test Suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-repository-tests:
    name: Full pytest suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and collection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask openpyxl tzdata

      - name: Run every repository test
        run: python -m pytest -q
