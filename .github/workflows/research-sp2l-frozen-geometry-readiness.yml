name: Research - SP2L Frozen Geometry Readiness

on:
  pull_request:
    paths:
      - 'research/gates/**'
      - 'docs/research/SP2L_FROZEN_GEOMETRY_READINESS_2026-09-14.md'
      - '.github/workflows/research-sp2l-frozen-geometry-readiness.yml'
  push:
    branches:
      - research/sp2l-frozen-geometry-readiness-2026-09-14

jobs:
  readiness-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run deterministic readiness tests
        run: python -m pytest -q research/gates/test_sp2l_frozen_geometry_readiness.py
