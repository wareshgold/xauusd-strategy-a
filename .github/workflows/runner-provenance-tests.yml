name: Runner provenance tests

on:
  push:
    branches:
      - research/runner-provenance-identity-20261118
    paths:
      - "scripts/sp2l_runner_provenance.py"
      - "tests/test_sp2l_runner_provenance.py"
      - ".github/workflows/runner-provenance-tests.yml"
  pull_request:
    paths:
      - "scripts/sp2l_runner_provenance.py"
      - "tests/test_sp2l_runner_provenance.py"
      - ".github/workflows/runner-provenance-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/sp2l_runner_provenance.py tests/test_sp2l_runner_provenance.py
      - name: Run isolated unit tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p "test_sp2l_runner_provenance.py" -v
