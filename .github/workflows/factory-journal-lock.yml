name: Factory Journal Lock Cross-Platform Tests

on:
  push:
    branches:
      - "research/**"
  pull_request:

jobs:
  journal-lock-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest 'cryptography>=44,<47' 'jsonschema>=4.23,<5'

      - name: Run journal locking, trust audit, and forward preparation tests
        run: python -m pytest -q tests/test_forward_preparation.py tests/test_trust_audit.py
