name: V3.1 history helper regression tests

on:
  push:
    branches:
      - fix/v31-active-order-history-query-20261110

permissions:
  contents: read

jobs:
  history-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run V3.1 tracked history helper tests
        run: python -m pytest -q tests/test_sp2l_tracked_deal_history.py
      - name: Compile V3.1 runner and helper
        run: python -m py_compile scripts/run_sp2l_v3_1_xauusd_forward_test.py scripts/sp2l_tracked_deal_history.py
