name: foundation-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domain/market.ts'
      - 'src/engine/**'
      - 'src/replay/**'
      - 'src/research/metrics.ts'
      - 'tests/backtest-runner.test.ts'
      - 'tests/csv-replay.test.ts'
      - 'tests/deterministic-engine.test.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/foundation-ci.yml'
  push:
    branches:
      - 'dev/deterministic-engine-foundation-clean-2026-09-14'

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run build
      - name: Foundation tests
        run: npx vitest run tests/deterministic-engine.test.ts tests/csv-replay.test.ts tests/backtest-runner.test.ts
