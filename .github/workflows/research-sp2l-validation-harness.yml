name: Research - SP2L Validation Harness

on:
  push:
    paths:
      - 'research/harness/**'
      - 'tests/sp2l-**'
      - 'scripts/run-author-replica-backtest.mjs'
      - 'data/historical/xauusd-1min.json'
      - 'data/reports/strategy-a-baseline/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.sp2l-harness.json'
      - '.github/workflows/research-sp2l-validation-harness.yml'
  pull_request:
    paths:
      - 'research/harness/**'
      - 'tests/sp2l-**'
      - 'scripts/run-author-replica-backtest.mjs'
      - 'data/historical/xauusd-1min.json'
      - 'data/reports/strategy-a-baseline/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.sp2l-harness.json'
      - '.github/workflows/research-sp2l-validation-harness.yml'

permissions:
  contents: read

jobs:
  validation-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Typecheck SP2L validation harness
        run: npx tsc -p tsconfig.sp2l-harness.json --noEmit

      - name: Run SP2L validation harness tests
        run: npx vitest run tests/sp2l-geometry-contract.test.ts tests/sp2l-frozen-geometry-gate.test.ts tests/sp2l-validation-report.test.ts tests/sp2l-fixture-runner.test.ts tests/sp2l-integrity-invariants.test.ts tests/sp2l-determinism-invariants.test.ts tests/sp2l-125r-golden-fixture.test.ts tests/sp2l-synthetic-geometry-fixtures.test.ts tests/sp2l-baseline-forensic-accounting.test.ts

      - name: Run author replica XAUUSD 1m research backtest
        run: node scripts/run-author-replica-backtest.mjs

      - name: Upload author replica research artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp2l-author-replica-backtest
          path: artifacts/sp2l-author-replica-backtest.json
