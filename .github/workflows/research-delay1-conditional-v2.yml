name: Research - DELAY1 nested conditional information

on:
  push:
    branches:
      - research/entry-edge-post-entry-path
    paths:
      - 'scripts/analyze-delay1-continuous-path-conditional-information.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'data/historical/**'
      - 'data/reports/strategy-a-baseline/**'
      - '.github/workflows/research-delay1-conditional-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/entry-edge-post-entry-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run research:delay1-continuous-path-conditional-information
      - uses: actions/upload-artifact@v4
        with:
          name: delay1-nested-conditional-information
          path: data/reports/strategy-a-delay1-nested-conditional-information/*.json
          if-no-files-found: error
