name: Research - SP2L G397 Synthetic Geometry Discrimination

on:
  push:
    branches:
      - research/sp2l-g388-dataset-runner-2026-09-13
  pull_request:
    branches:
      - research/sp2l-g386-dev-harness-2026-09-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run tests/sp2l-v2/g397-synthetic-geometry-discrimination.test.ts
