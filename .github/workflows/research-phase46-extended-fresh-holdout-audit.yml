name: Research - SP2L Phase46 Extended Fresh Holdout Audit
on:
  push:
    branches: [research/phase42-full-history-expansion]
    paths:
      - 'scripts/research-phase46-extended-fresh-holdout-audit.mjs'
      - 'package.json'
      - 'data/historical/xauusd-1min.json'
      - '.github/workflows/research-phase46-extended-fresh-holdout-audit.yml'
  workflow_dispatch:
jobs:
  phase46:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm research:phase46-extended-fresh-holdout-audit
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-a-phase46-extended-fresh-holdout-audit
          path: data/reports/strategy-a-phase46-extended-fresh-holdout-audit/5min.json
