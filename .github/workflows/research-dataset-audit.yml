name: Research - Historical Dataset Audit

on:
  push:
    branches:
      - research/sp2l-g385-semantic-core-dev-harness-2026-09-13
    paths:
      - 'data/historical/xauusd-1min.json'
      - 'data/historical/xauusd-5min.json'
      - 'scripts/audit-dataset.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/research-dataset-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:data
      - uses: actions/upload-artifact@v4
        with:
          name: historical-dataset-audit
          path: data/reports/dataset-audit.json
          if-no-files-found: error
