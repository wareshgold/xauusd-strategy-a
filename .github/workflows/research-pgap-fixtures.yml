name: Research P-Gap fixtures

on:
  push:
    paths:
      - 'research/fixtures/**'
      - 'requirements-research.txt'
      - '.github/workflows/research-pgap-fixtures.yml'
  pull_request:
    paths:
      - 'research/fixtures/**'
      - 'requirements-research.txt'
      - '.github/workflows/research-pgap-fixtures.yml'

jobs:
  pytest-pgap-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pytest -q research/fixtures/test_sp2l_pgap_synthetic_fixtures_g228.py research/fixtures/test_sp2l_pgap_numeric_fixtures_g239.py
