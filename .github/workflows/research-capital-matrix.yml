name: Research - Capital Management Matrix

on:
  pull_request:
    paths:
      - 'research/capital_matrix/**'
      - 'tests/research/test_capital_matrix.py'
      - 'tests/research/test_v31_population_builder.py'
      - '.github/workflows/research-capital-matrix.yml'

permissions:
  contents: read

jobs:
  capital-matrix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused offline tests
        run: python -m unittest tests.research.test_capital_matrix tests.research.test_v31_population_builder -v
