name: Research - SP2L Spec Kit Coverage Pilot

on:
  push:
  pull_request:

jobs:
  coverage-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run deterministic coverage tests
        run: python -m pytest -q research/engine/test_dataset_coverage.py
      - name: Re-run deterministic coverage tests
        run: python -m pytest -q research/engine/test_dataset_coverage.py
      - name: Governance scan of executable pilot component
        run: |
          ! grep -niE 'BUY|SELL|P-Gap|P-GAP|AB=CD|Leg.?2|entry.?anchor|fill.?semantics|target.?formula|bearish.?mirror' research/engine/dataset_coverage.py
