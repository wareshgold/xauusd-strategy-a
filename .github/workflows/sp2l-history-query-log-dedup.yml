name: SP2L history query log dedup tests

on:
  pull_request:
    paths:
      - "scripts/sp2l_history_query_failure_log.py"
      - "scripts/run_sp2l_v3_xauusd_forward_test.py"
      - "tests/test_sp2l_history_query_failure_log.py"
      - ".github/workflows/sp2l-history-query-log-dedup.yml"
  push:
    branches:
      - "fix/rr2-trail4-history-query-log-dedup-20261015"

jobs:
  history-query-log-dedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run history query log dedup tests
        run: python -m pytest -q tests/test_sp2l_history_query_failure_log.py
