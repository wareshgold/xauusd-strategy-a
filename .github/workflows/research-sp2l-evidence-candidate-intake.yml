name: Research - SP2L Evidence Candidate Intake

on:
  push:
  pull_request:

jobs:
  intake-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q research/evidence/test_sp2l_evidence_candidate_intake.py
