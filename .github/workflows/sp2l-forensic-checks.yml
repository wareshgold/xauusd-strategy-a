name: SP2L forensic deterministic checks

on:
  push:
    branches:
      - "research/sp2l-f13-forensic-repro-*"
  pull_request:

jobs:
  forensic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: python -m pip install numpy pytest
      - name: Run shared detector fixture
        run: python scripts/test_sp2l_author_replica_detector_consistency.py
      - name: Run V3.1 deal lifecycle idempotency tests
        run: python scripts/test_sp2l_deal_lifecycle_dedupe.py
      - name: Run V3.1 startup broker recovery tests
        run: python scripts/test_sp2l_v31_startup_recovery.py
      - name: Run shared runner lock tests
        run: python scripts/test_sp2l_runner_lock.py
      - name: Compile V3.1 forward runner modules
        run: python -m py_compile scripts/run_sp2l_author_replica_multi_symbol_forward_test.py scripts/run_sp2l_v3_1_xauusd_forward_test.py scripts/sp2l_v31_startup_recovery.py scripts/sp2l_runner_lock.py
      - name: Run Telegram credential source tests
        run: python scripts/test_telegram_client_env.py
      - name: Run reconciliation tests
        run: python -m pytest -q tests/test_reconcile_sp2l_forward_backtest.py
