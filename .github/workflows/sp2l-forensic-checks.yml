name: SP2L forensic deterministic checks

on:
  push:
    branches:
      - "research/sp2l-f13-forensic-repro-*"
  pull_request:

jobs:
  forensic-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: python -m pip install flask numpy pytest
      - name: Run shared detector fixture
        run: python scripts/test_sp2l_author_replica_detector_consistency.py
      - name: Run V3.1 deal lifecycle idempotency tests
        run: python scripts/test_sp2l_deal_lifecycle_dedupe.py
      - name: Run V3.1 startup broker recovery tests
        run: python scripts/test_sp2l_v31_startup_recovery.py
      - name: Run V3.1 trailing broker-safety tests
        run: python -m pytest -q tests/test_sp2l_trailing_rules.py
      - name: Run V3.1 RR4 ACT40 monitor diagnostics tests
        run: python -m pytest -q tests/test_sp2l_v31_rr4_act40_monitor.py
      - name: Run V3.1 trailing excursion persistence tests
        run: python -m pytest -q tests/test_sp2l_trailing_state.py
      - name: Run restored history-query diagnostic tests
        run: python -m pytest -q tests/test_sp2l_history_query_failure_log.py
      - name: Run restored tracked-deal history tests
        run: python -m pytest -q tests/test_sp2l_tracked_deal_history.py
      - name: Run shared runner lock tests
        run: python scripts/test_sp2l_runner_lock.py
      - name: Compile V3.1 forward runner modules
        run: python -m py_compile scripts/run_sp2l_author_replica_multi_symbol_forward_test.py scripts/run_sp2l_v3_1_xauusd_forward_test.py scripts/sp2l_v31_startup_recovery.py scripts/sp2l_runner_lock.py scripts/sp2l_trailing_rules.py scripts/sp2l_trailing_state.py scripts/sp2l_history_query_failure_log.py scripts/sp2l_tracked_deal_history.py
      - name: Run Telegram credential source tests
        run: python scripts/test_telegram_client_env.py
      - name: Run reconciliation tests
        run: python -m pytest -q tests/test_reconcile_sp2l_forward_backtest.py
