name: SP2L forensic deterministic checks

on:
  push:
    branches:
      - "research/sp2l-f13-forensic-repro-*"
      - "fix/rr2-trail4-pending-lifecycle-safe-*"
  pull_request:

jobs:
  forensic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: python -m pip install numpy pytest
      - name: Run shared detector fixture
        run: python scripts/test_sp2l_author_replica_detector_consistency.py
      - name: Run reconciliation tests
        run: python -m pytest -q tests/test_reconcile_sp2l_forward_backtest.py
      - name: Run pending-order expiry regression tests
        run: python -m pytest -q tests/test_sp2l_v3_pending_expiry.py tests/test_pending_order_expiry.py
      - name: Run tracked-deal history query regression tests
        run: python -m pytest -q tests/test_sp2l_v3_tracked_deal_history.py
      - name: Run trailing matrix chronology audit tests
        run: python -m pytest -q tests/test_sp2l_v3_xauusd_trailing_matrix_audit.py
