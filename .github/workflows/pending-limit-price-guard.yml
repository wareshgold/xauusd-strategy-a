name: Pending limit price guard regression

on:
  pull_request:
    branches:
      - fix/rr2-trail4-telegram-deal-time-20261013
    paths:
      - "scripts/live_mt5_gateway.py"
      - "tests/test_live_mt5_gateway.py"
      - ".github/workflows/pending-limit-price-guard.yml"

jobs:
  pending-limit-price-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run gateway regression tests
        run: python -m pytest -q tests/test_live_mt5_gateway.py
