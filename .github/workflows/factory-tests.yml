name: Factory Research Tests

on:
  push:
    branches:
      - "research/**"
  pull_request:

jobs:
  factory-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run Factory focused suite
        run: |
          python -m pytest             tests/test_factory_e2e_smoke.py             tests/test_discovery_adapter.py             tests/test_mt5_dataset.py             tests/test_discovery_factory.py             tests/test_handoff_dataset_binding.py             tests/test_stability_factory.py             tests/test_validation_factory.py \
          tests/test_forward_observed_evidence.py \
          tests/test_forward_observed_statistics.py \
          tests/test_forward_statistical_boundary.py \
          tests/test_forward_observed_report.py \
          tests/test_factory_forward_e2e_readiness.py \
          tests/test_factory_holdout_forward_e2e.py \
          tests/test_factory_job_events.py \
          tests/test_factory_worker_journal_audit.py \
          tests/test_factory_test_journal_isolation.py \
          tests/test_factory_orchestrator_default_journal_isolation.py \
          tests/test_comparison_validation_gate.py \
          tests/test_strategy_factory_synthetic_fixtures.py \
          tests/test_strategy_factory_source_execution_fixtures.py \
          tests/test_live_mt5_gateway.py \
          tests/test_strategy_factory_source_order_lifecycle.py \
          tests/test_strategy_factory_order_deal_reconciliation.py \
          tests/test_strategy_factory_event_timeline_audit.py \
          tests/test_strategy_factory_observed_deal_economics.py \
          tests/test_strategy_factory_history_query_fixtures.py \
          tests/test_strategy_factory_research_brain.py \
          tests/test_strategy_factory_evidence_graph.py \
          tests/test_strategy_factory_research_ledger.py \
          tests/test_strategy_factory_experiment_planner.py \
          tests/test_strategy_factory_execution_result_ingestion.py \
          tests/test_strategy_factory_ledger_report.py -q

      - name: Run dataset manifest integrity tests
        run: python -m pytest tests/test_dataset_manifest.py -q
      - name: Run dataset manifest pin ledger tests
        run: python -m pytest tests/test_dataset_manifest_pin_ledger.py -q

      - name: Run research quality and certification boundary tests
        run: python -m pytest tests/test_unified_research_quality.py tests/test_research_certification.py tests/test_research_certification_ledger.py -q
