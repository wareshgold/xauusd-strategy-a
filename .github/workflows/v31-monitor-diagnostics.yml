name: V3.1 monitor diagnostics tests

on:
  pull_request:
    paths:
      - "scripts/sp2l_v31_rr4_act40_monitor.py"
      - "tests/test_sp2l_v31_rr4_act40_monitor.py"
      - ".github/workflows/v31-monitor-diagnostics.yml"
  push:
    branches:
      - "fix/v31-monitor-trailing-diagnostics-20261103"
    paths:
      - "scripts/sp2l_v31_rr4_act40_monitor.py"
      - "tests/test_sp2l_v31_rr4_act40_monitor.py"
      - ".github/workflows/v31-monitor-diagnostics.yml"

permissions:
  contents: read

jobs:
  monitor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install monitor test dependencies
        run: python -m pip install --upgrade pytest flask
      - name: Run V3.1 monitor diagnostics tests
        run: python -m pytest -q tests/test_sp2l_v31_rr4_act40_monitor.py
