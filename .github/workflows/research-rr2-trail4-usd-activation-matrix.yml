name: Research - RR2 TRAIL4 USD Activation Matrix

on:
  pull_request:
    paths:
      - 'scripts/run_sp2l_v3_xauusd_trailing_matrix.py'
      - 'scripts/run_sp2l_v3_xauusd_usd_activation_matrix.py'
      - 'tests/test_sp2l_v3_xauusd_trailing_matrix_audit.py'
      - 'tests/test_sp2l_v3_xauusd_usd_activation_matrix.py'
      - '.github/workflows/research-rr2-trail4-usd-activation-matrix.yml'
  push:
    branches:
      - research/rr2-trail4-usd-activation-matrix-20261027
    paths:
      - 'scripts/run_sp2l_v3_xauusd_trailing_matrix.py'
      - 'scripts/run_sp2l_v3_xauusd_usd_activation_matrix.py'
      - 'tests/test_sp2l_v3_xauusd_trailing_matrix_audit.py'
      - 'tests/test_sp2l_v3_xauusd_usd_activation_matrix.py'
      - '.github/workflows/research-rr2-trail4-usd-activation-matrix.yml'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Compile research scripts
        run: python -m py_compile scripts/run_sp2l_v3_xauusd_trailing_matrix.py scripts/run_sp2l_v3_xauusd_usd_activation_matrix.py
      - name: Run trailing-matrix unit tests
        run: python -m pytest -q tests/test_sp2l_v3_xauusd_trailing_matrix_audit.py tests/test_sp2l_v3_xauusd_usd_activation_matrix.py
